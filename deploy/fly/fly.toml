# ctreg-mcp-http — Fly.io 설정.
#
# 띄우는 법(저장소 루트에서):
#   fly launch --config deploy/fly/fly.toml --dockerfile deploy/fly/Dockerfile --no-deploy
#   fly volumes create ctreg_data --region nrt --size 1
#   fly secrets set CTREG_CRIS_SERVICE_KEY=<공공데이터포털 Decoding 키>
#   fly deploy --config deploy/fly/fly.toml --dockerfile deploy/fly/Dockerfile
#
# 확인:
#   curl https://<app>.fly.dev/stats
#
# 인증이 없다 — URL 을 아는 누구나 쓴다. 그렇게 정했다(2026-09-10). 요청률은 이 프로세스의
# 자체 버킷(레지스트리별 1 req/s)이 지키므로 **인스턴스는 하나여야 한다** — 둘이면 버킷도
# 둘이 되어 레지스트리에 두 배로 나간다.

app = "ctreg-mcp"          # fly launch 가 이름이 겹치면 바꿔 준다
# `fly launch` 는 개인 org 를 기본으로 잡는데 결제수단은 이쪽에 있다(2026-09-10 실제로 걸렸다).
# 여기 박아 두면 --org 를 잊어도 맞는 곳으로 간다.
org = "nanum-space-co-ltd"
primary_region = "nrt"     # 도쿄. CRIS·한국 사용자와 가깝다. 서울(icn)이 열려 있으면 그쪽

[build]
  dockerfile = "Dockerfile"
  [build.args]
    CTREG_VERSION = "0.4.0"   # 새 버전을 낼 때 여기도 올린다 — 그래야 재배포가 새 코드를 받는다

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"   # 아무도 안 쓰면 멈춘다 — 비용이 0 에 가까워진다
  auto_start_machines = true    # 요청이 오면 깬다. 첫 응답이 몇 초 늦는 것이 대가다
  min_machines_running = 0
  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 50

[[mounts]]
  source = "ctreg_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"           # 대부분 네트워크 대기라 이걸로 충분할 것이다 — 추정이다. /stats 의 p50 과 Fly 대시보드로 확인한다
