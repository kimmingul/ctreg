# ctreg-mcp-http — Fly.io 설정.
#
# 띄우는 법(저장소 루트에서). **`fly launch` 대신 `apps create` 를 쓴다** — launch 는 대화형이고
# org 를 fly.toml 에서 읽지 않는다. 2026-09-10 에 실제로 이 순서로 띄웠다:
#   fly apps create ctreg-mcp --org nanum-space-co-ltd
#   fly volumes create ctreg_data --app ctreg-mcp --region nrt --size 1 --yes
#   fly secrets set --app ctreg-mcp CTREG_CRIS_SERVICE_KEY=<공공데이터포털 Decoding 키>
#   fly deploy --app ctreg-mcp --config deploy/fly/fly.toml --dockerfile deploy/fly/Dockerfile --remote-only --ha=false
#
# 확인:
#   curl https://ctreg-mcp.fly.dev/stats
#
# 인증이 없다 — URL 을 아는 누구나 쓴다. 그렇게 정했다(2026-09-10). 요청률은 이 프로세스의
# 자체 버킷(레지스트리별 1 req/s)이 지키므로 **인스턴스는 하나여야 한다** — 둘이면 버킷도
# 둘이 되어 레지스트리에 두 배로 나간다.

app = "ctreg-mcp"          # fly launch 가 이름이 겹치면 바꿔 준다
# **org 는 여기 적어도 소용없다 — `fly launch` 가 이 파일의 org 키를 읽지 않는다.**
# 실제로 겪었다(2026-09-10): org 를 박아 두고 launch 했는데 여전히 개인 org 로 갔고, 그쪽엔
# 결제수단이 없어 "payment method required" 로 멈췄다. **`--org nanum-space-co-ltd` 를
# 커맨드라인에 반드시 붙인다.** 앱이 한 번 만들어지면 그 뒤 명령(volumes·secrets·deploy)은
# 앱에 묶이므로 다시 줄 필요 없다.
primary_region = "nrt"     # 도쿄. CRIS·한국 사용자와 가깝다. 서울(icn)이 열려 있으면 그쪽

[build]
  dockerfile = "Dockerfile"
  [build.args]
    CTREG_VERSION = "0.7.0"   # 새 버전을 낼 때 여기도 올린다 — 그래야 재배포가 새 코드를 받는다

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"   # 아무도 안 쓰면 멈춘다 — 비용이 0 에 가까워진다
  auto_start_machines = true    # 요청이 오면 깬다. 첫 응답이 몇 초 늦는 것이 대가다
  min_machines_running = 0
  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 50

[[mounts]]
  source = "ctreg_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"           # 대부분 네트워크 대기라 이걸로 충분할 것이다 — 추정이다. /stats 의 p50 과 Fly 대시보드로 확인한다
